name: Vector60 Windows build gate / internal unsigned artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/vector60-internal-windows.yml"
      - "apps/starbridge-desktop/**"
      - "starbridge_mcp/vectorization/**"
      - "tests/test_vector60_runtime_packaging.py"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "THIRD_PARTY_NOTICES.md"

permissions:
  contents: read

concurrency:
  group: vector60-internal-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-internal-unsigned-installer:
    name: Build INTERNAL / UNSIGNED / NOT FOR RELEASE installer
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/starbridge-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked test and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector60]"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/starbridge-desktop

      - name: Prepare Tauri test resources
        shell: pwsh
        run: |
          $sidecarDir = "apps/starbridge-desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path "$sidecarDir/_internal" | Out-Null
          New-Item -ItemType File -Force -Path "$sidecarDir/_internal/.ci-placeholder" | Out-Null
          New-Item -ItemType File -Force -Path "$sidecarDir/starbridge-sidecar-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Verify release metadata and unsigned-only boundary
        shell: pwsh
        run: |
          python -m unittest tests.test_vector60_third_party tests.test_vector60_runtime_packaging tests.test_tauri_platform_config
          python scripts/security_check.py
          npm test --prefix apps/starbridge-desktop
          npm run build --prefix apps/starbridge-desktop
          cargo fmt --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml

      - name: Build and exercise the packaged Python sidecar
        shell: pwsh
        run: |
          apps/starbridge-desktop/scripts/Build-Sidecar.ps1 -TargetTriple x86_64-pc-windows-msvc
          apps/starbridge-desktop/scripts/Test-Sidecar.ps1 -TargetTriple x86_64-pc-windows-msvc

      - name: Build the internal unsigned NSIS installer
        shell: pwsh
        run: |
          Push-Location apps/starbridge-desktop
          try {
            npm run tauri -- build --bundles nsis
          }
          finally {
            Pop-Location
          }

      - name: Assemble fail-closed internal evidence
        shell: pwsh
        run: |
          $bundle = "apps/starbridge-desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $bundle -File -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The internal NSIS installer was not produced."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "This workflow is unsigned-only and refuses an installer with any other signature status."
          }

          $sidecar = "apps/starbridge-desktop/src-tauri/binaries/starbridge-sidecar-x86_64-pc-windows-msvc.exe"
          $runtime = (& $sidecar --vector60-runtime-check | Out-String).Trim() | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $runtime.ok) {
            throw "The staged sidecar failed its Vector60 runtime check."
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP "vector60-internal-unsigned"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $assetName = "KORYAO-Vector60-INTERNAL-UNSIGNED-NOT-FOR-RELEASE_${shortSha}_x64-setup.exe"
          $assetPath = Join-Path $artifactRoot $assetName
          Copy-Item -LiteralPath $installer.FullName -Destination $assetPath
          $sha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()

          [ordered]@{
            schema_version = "koryao.vector60-internal-windows-artifact.v1"
            status = "INTERNAL_UNSIGNED_NOT_FOR_RELEASE"
            source_commit = $env:GITHUB_SHA
            installer_asset = $assetName
            installer_sha256 = $sha256
            installer_authenticode = "NotSigned"
            vector60_python_runtime_included = $true
            vector60_python_runtime_versions = $runtime.versions
            node_runtime_included = $false
            svgo_runtime_included = $false
            clean_machine_install_validated = $false
            defender_validated = $false
            smartscreen_validated = $false
          } | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $artifactRoot "INTERNAL-UNSIGNED-NOT-FOR-RELEASE.json") -Encoding utf8NoBOM
          "VECTOR60_INTERNAL_ARTIFACT_DIR=$artifactRoot" >> $env:GITHUB_ENV

      - name: Upload short-lived internal test artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: KORYAO-Vector60-INTERNAL-UNSIGNED-NOT-FOR-RELEASE-${{ github.sha }}
          path: ${{ env.VECTOR60_INTERNAL_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
